<style>
  :root{
    --black:#000000;
    --black-2:#080808;
    --gold:#c7cdd4;
    --gold-bright:#f2f5f8;
    --gold-dim:#6e747a;
    --ink:#e8e9eb;
    --ink-dim:#9a9ea3;
    --hair:rgba(199,205,212,0.22);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--black);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow-x:hidden;
  }
  body[dir="rtl"]{ font-family:'Tajawal', sans-serif; }

  .lang-toggle{
    position:fixed;
    top:20px;
    inset-inline-end:20px;
    z-index:10;
    background:transparent;
    border:1px solid var(--hair);
    color:var(--ink-dim);
    font-family:'Inter',sans-serif;
    font-size:13px;
    letter-spacing:0.03em;
    padding:8px 16px;
    border-radius:999px;
    cursor:pointer;
    transition:border-color 0.25s ease, color 0.25s ease;
  }
  .lang-toggle:hover{ border-color:var(--gold); color:var(--gold-bright); }
  .lang-toggle:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  main{
    width:100%;
    max-width:640px;
    padding:100px 28px 64px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .logo{
    width:132px;
    height:132px;
    object-fit:contain;
    margin-bottom:28px;
  }

  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:clamp(48px, 11vw, 76px);
    line-height:1;
    margin:0 0 22px;
    color:var(--gold-bright);
    letter-spacing:0.005em;
  }
  body[dir="rtl"] h1{ font-family:'Tajawal', sans-serif; font-weight:700; }

  p.lede{
    font-size:17px;
    line-height:1.65;
    color:var(--ink-dim);
    max-width:440px;
    margin:0 0 40px;
  }
  body[dir="rtl"] p.lede{ font-size:18px; }

  .divider{
    width:44px;
    height:1px;
    background:var(--gold-dim);
    margin:0 0 40px;
  }

  .trust{
    list-style:none;
    margin:36px 0 0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:12px;
    align-items:center;
  }
  .trust li{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:13.5px;
    color:var(--ink-dim);
    letter-spacing:0.01em;
  }
  body[dir="rtl"] .trust li{ font-size:14.5px; }
  .trust svg{
    width:15px;
    height:15px;
    flex-shrink:0;
    color:var(--gold-dim);
  }

  .cta{
    display:inline-flex;
    align-items:center;
    gap:10px;
    background:var(--gold);
    color:#0c0d0e;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:15px;
    text-decoration:none;
    padding:16px 32px;
    border-radius:999px;
    transition:transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    box-shadow:0 8px 24px rgba(199,205,212,0.14);
  }
  body[dir="rtl"] .cta{ font-family:'Tajawal',sans-serif; font-weight:700; }
  .cta:hover{ background:var(--gold-bright); transform:translateY(-2px); box-shadow:0 10px 28px rgba(199,205,212,0.22); }
  .cta:focus-visible{ outline:2px solid var(--gold-bright); outline-offset:3px; }
  .cta svg{ width:19px; height:19px; flex-shrink:0; }

  footer{
    margin-top:56px;
    font-size:12px;
    letter-spacing:0.06em;
    color:#5c5648;
  }

  @media (prefers-reduced-motion: reduce){
    .cta{ transition:none; }
  }
</style>
</head>
